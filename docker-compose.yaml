services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bckndtest
    volumes:
      - "./internal/db/init.sql:/docker-entrypoint-initdb.d/init.sql"
    ports:
      - "5433:5432"
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    depends_on:
      - db
